name: One-time SDK v0.6.1 patch release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.6.1-once.yml']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Synchronize lockfile and verify
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
      - name: Commit lockfile and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: synchronize v0.6.1 lockfile'
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.6.1 >/dev/null; then
            echo 'v0.6.1 tag already exists'
            exit 1
          fi
          git tag v0.6.1 HEAD
          git push origin v0.6.1
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          # v0.6.1

          Removes scoped API-key administration from the JavaScript and TypeScript SDK.

          - Removed SDK methods for listing, creating, and revoking API keys.
          - Removed public API-key management resource and related types.
          - Retained reusable cookie-state management introduced in v0.6.0.
          - API keys remain managed in Figranium's own interface.

          This patch supersedes v0.6.0 for users who want an SDK without API-key administration.
          EOF
          gh release create v0.6.1 --title v0.6.1 --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/release-v0.6.1-once.yml
          git commit -m 'ci: remove completed v0.6.1 release trigger'
          git pull --rebase origin main
          git push origin HEAD:main
