name: One-time SDK v0.6.0 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.6.0-once.yml']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install and verify
        run: |
          npm ci
          npm run check
      - name: Commit lockfile, tag and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: synchronize v0.6.0 package lock'
            git push origin HEAD:main
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.6.0 >/dev/null; then
            echo 'v0.6.0 already tagged; refusing to overwrite'
            exit 1
          fi
          git tag v0.6.0 HEAD
          git push origin v0.6.0
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          # v0.6.0

          Adds Figranium v0.21.0 workspace-management APIs to the JavaScript and TypeScript SDK.

          - Manage named, scoped API keys with permissions and optional Task allowlists.
          - List, inspect, create, rename, update, and delete reusable browser cookie states.
          - TypeScript models for scoped keys and Playwright storage state.
          - Regression tests for endpoints, payloads, and session-authenticated requests.

          These privileged operations require an authenticated workspace session; scoped API keys are not intended to manage other keys or browser states.
          EOF
          gh release create v0.6.0 --title v0.6.0 --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/release-v0.6.0-once.yml
          git commit -m 'ci: remove completed v0.6.0 one-time release'
          git pull --rebase origin main
          git push origin HEAD:main
