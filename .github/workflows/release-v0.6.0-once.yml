name: Clean up one-time v0.6.0 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.6.0-once.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore release-only publishing and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sed -i '/^  push:$/,/^  release:$/ { /^  release:$/!d; }' .github/workflows/publish.yml
          sed -i 's/github.event.release.tag_name || github.sha/github.event.release.tag_name/' .github/workflows/publish.yml
          git rm .github/workflows/release-v0.6.0-once.yml
          git add .github/workflows/publish.yml
          git commit -m 'ci: restore normal release workflows after v0.6.0'
          git pull --rebase origin main
          git push origin HEAD:main
